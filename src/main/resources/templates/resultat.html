<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'VinciMeteo - ' + ${ville.nom}">VinciMeteo - Résultat</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="carte">
    <h1 th:text="${ville.nom}">Paris</h1>

    <p class="meteo" th:text="${meteo.temperature}">20°C</p>

    <table>
        <tr>
            <th>Latitude</th>
            <td th:text="${ville.latitude}">48.8566</td>
        </tr>
        <tr>
            <th>Longitude</th>
            <td th:text="${ville.longitude}">2.3522</td>
        </tr>
    </table>

    <!-- Si l'heure ne bouge pas quand tu recharges la page, la donnée vient du cache -->
    <p class="info">
        Donnée récupérée à <span th:text="${meteo.recupereeA}">10:00:00</span>
        (<span th:text="${nombreAppels}">1</span> appel(s) API depuis le démarrage)
    </p>

    <a th:href="@{/}">&larr; Choisir une autre ville</a>
</main>
</body>
</html>
